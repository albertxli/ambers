name: Build & Publish

# build -> verify -> publish.
# Publishing only runs for a pushed v* tag, and only if every verify job passed.
# A manual "Run workflow" (workflow_dispatch) is a full dry run: same builds and checks,
# nothing is published. Do one before tagging a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Release sanity: tag == Cargo.toml == pyproject.toml, CHANGELOG entry exists.
  # The root Cargo.toml is the workspace manifest; its first `version` line is
  # [workspace.package] version, which every crate inherits.
  # ---------------------------------------------------------------
  preflight:
    name: Preflight / versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions and changelog
        shell: bash
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          py_v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Cargo.toml=$cargo_v pyproject.toml=$py_v ref=$GITHUB_REF"
          [ "$cargo_v" = "$py_v" ] || { echo "::error::Cargo.toml ($cargo_v) != pyproject.toml ($py_v)"; exit 1; }
          # Internal crates in [workspace.dependencies] carry their own version string.
          stale=$(grep -E '^ambers(-[a-z]+)? = \{ path' Cargo.toml | grep -v "version = \"$cargo_v\"" || true)
          [ -z "$stale" ] || { echo "::error::internal crate versions differ from $cargo_v: $stale"; exit 1; }
          grep -qE "^##.*\b${cargo_v//./\\.}\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no heading for $cargo_v"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_v=${GITHUB_REF#refs/tags/v}
            [ "$tag_v" = "$cargo_v" ] || { echo "::error::tag v$tag_v != package version $cargo_v"; exit 1; }
          fi

  # ---------------------------------------------------------------
  # Build Python wheels for each OS × Python version
  # ---------------------------------------------------------------
  build:
    name: Build / ${{ matrix.os }} / ${{ matrix.python }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          # Portable CPU baseline per platform (GitHub issue #6). Never `native`:
          # that targets whatever CPU the runner VM happens to have.
          - os: ubuntu-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            rustflags: "-C target-cpu=apple-m1"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          # Linux: build inside the manylinux2014 container -> manylinux_2_17 wheels
          # (glibc 2.17+), instead of the runner host's glibc. Ignored on other OSes.
          manylinux: auto
          args: --release -o dist -i python${{ matrix.python }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  # ---------------------------------------------------------------
  # Build source distribution (fallback for unsupported platforms)
  # ---------------------------------------------------------------
  sdist:
    name: Build sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------
  # Build the standalone `ambers` binary: no Python, no C runtime to install.
  # Keep in sync with the `cli` job in ci.yml.
  # ---------------------------------------------------------------
  cli:
    name: CLI binary / ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+crt-static"
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: "-C target-cpu=apple-m1"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        run: cargo build --release -p ambers-cli --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          target/${{ matrix.target }}/release/ambers info tests/data/survey.zsav --rows 3
          target/${{ matrix.target }}/release/am info tests/data/survey.zsav --rows 3

      - name: Check the binary is standalone (Linux)
        if: runner.os == 'Linux'
        run: |
          if readelf -d target/${{ matrix.target }}/release/ambers target/${{ matrix.target }}/release/am | grep NEEDED; then
            echo "::error::the Linux binary needs shared libraries"; exit 1
          fi

      - name: Check the binary is standalone (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/check_cli_imports.py target/${{ matrix.target }}/release/ambers.exe
          python scripts/check_cli_imports.py target/${{ matrix.target }}/release/am.exe

      - name: Check the binary is standalone (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L target/${{ matrix.target }}/release/ambers
          if otool -L target/${{ matrix.target }}/release/ambers | grep -i python; then
            echo "::error::the macOS binary links Python"; exit 1
          fi

      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=ambers-$version-${{ matrix.target }}
          mkdir -p cli-dist/$name
          cp README.md LICENSE cli-dist/$name/
          cd cli-dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp ../target/${{ matrix.target }}/release/ambers.exe ../target/${{ matrix.target }}/release/am.exe $name/
            7z a -bso0 $name.zip $name
          else
            cp ../target/${{ matrix.target }}/release/ambers ../target/${{ matrix.target }}/release/am $name/
            tar czf $name.tar.gz $name
          fi

      # The install scripts, given the archive just built instead of a download.
      - name: Install script (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          AMBERS_INSTALL_ARCHIVE=cli-dist/ambers-$version-${{ matrix.target }}.tar.gz \
            AMBERS_INSTALL_DIR="$RUNNER_TEMP/ambers-bin" sh install.sh
          "$RUNNER_TEMP/ambers-bin/am" info tests/data/survey.sav --head 0

      - name: Install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $env:AMBERS_INSTALL_ARCHIVE = "cli-dist/ambers-$version-${{ matrix.target }}.zip"
          $env:AMBERS_INSTALL_DIR = "$env:RUNNER_TEMP\ambers-bin"
          $env:AMBERS_NO_MODIFY_PATH = '1'
          ./install.ps1
          & "$env:RUNNER_TEMP\ambers-bin\am.exe" info tests/data/survey.sav --head 0
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            cli-dist/*.zip
            cli-dist/*.tar.gz

  # ---------------------------------------------------------------
  # Verify 1: static check, no instructions above the CPU baseline
  # ---------------------------------------------------------------
  verify-isa:
    name: Verify / CPU instructions
    needs: [build, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist-cli

      - name: Install disassemblers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils llvm

      - name: Check every wheel
        run: python3 scripts/check_wheel_isa.py --x86-baseline x86-64-v2 dist/

      - name: Check every CLI binary
        run: |
          # The script reads the architecture from the file name, so copy each
          # binary out of its archive under the archive's (target-tagged) name.
          mkdir cli-bin
          for a in dist-cli/*.tar.gz; do tar xzf "$a" -C dist-cli; done
          for a in dist-cli/*.zip; do unzip -q "$a" -d dist-cli; done
          for d in dist-cli/ambers-*/; do
            for b in "$d"ambers "$d"ambers.exe "$d"am "$d"am.exe; do
              if [ -f "$b" ]; then cp "$b" "cli-bin/$(basename "$d")-$(basename "$b")"; fi
            done
          done
          python3 scripts/check_wheel_isa.py --x86-baseline x86-64-v2 cli-bin/*

  # ---------------------------------------------------------------
  # Verify 2: run the Linux wheel on an emulated x86-64-v2 CPU (Intel SDE, Nehalem).
  # Any instruction above the baseline traps; runtime-dispatched code sees the emulated
  # CPUID and takes its fallback path, exactly as on a real old CPU.
  # ---------------------------------------------------------------
  verify-emulated:
    name: Verify / emulated x86-64-v2 CPU
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-py3.13
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install wheel
        # polars[rtcompat]: polars' own runtime for CPUs without AVX2 (its default needs AVX2).
        run: |
          uv pip install --system "polars[rtcompat]"
          uv pip install --system --no-deps --no-index dist/*.whl

      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1

      - name: Smoke test on emulated Nehalem (x86-64-v2)
        run: ${SDE_PATH}/sde64 -nhm -- python python/tests/smoke_wheel.py

  # ---------------------------------------------------------------
  # Verify 3: install the built wheel and run it on every OS × Python
  # ---------------------------------------------------------------
  verify-install:
    name: Verify / ${{ matrix.os }} / ${{ matrix.python }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - name: Install wheel (never from source)
        shell: bash
        run: |
          uv pip install --system polars pytest
          uv pip install --system --no-deps --no-index --only-binary ambers dist/*.whl

      - name: Smoke test
        run: python python/tests/smoke_wheel.py

      - name: Python tests (small/synthetic data only)
        run: pytest python/tests/test_apply_labels.py python/tests/test_apply_missing.py python/tests/test_validate.py python/tests/test_metadata_api.py python/tests/test_writer_issues.py python/tests/test_polars_compat.py python/tests/test_malformed.py python/tests/test_warnings.py python/tests/test_encoding.py python/tests/test_fixtures.py python/tests/test_cli.py python/tests/test_codebook.py python/tests/test_codebook_engine.py python/tests/test_codebook_types.py -q -k "not RealFile"

  verify-old-glibc:
    name: Verify / Debian 11 (glibc 2.31)
    needs: build
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-py3.12
          path: dist

      - name: Install wheel and smoke test
        run: |
          pip install -q polars
          pip install -q --no-deps --no-index dist/*.whl
          python python/tests/smoke_wheel.py

  # ---------------------------------------------------------------
  # Publish (tags only, after every check passed)
  # ---------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    needs: [preflight, build, sdist, cli, verify-isa, verify-emulated, verify-install, verify-old-glibc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish -p ambers --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: [preflight, build, sdist, cli, verify-isa, verify-emulated, verify-install, verify-old-glibc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    needs: [preflight, build, sdist, cli, verify-isa, verify-emulated, verify-install, verify-old-glibc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      # Standalone CLI archives: ambers-<version>-<target>.zip / .tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
