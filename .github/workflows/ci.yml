name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --lib --tests

  python-smoke:
    name: Python wheel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same CPU baselines as release.yml (GitHub issue #6).
          - os: ubuntu-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            rustflags: "-C target-cpu=apple-m1"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system maturin polars pytest

      - name: Build wheel
        run: maturin build --release -o dist

      - name: Install wheel
        shell: bash
        run: uv pip install --system --no-deps dist/*.whl

      - name: Smoke test
        run: python python/tests/smoke_wheel.py

      - uses: actions/upload-artifact@v4
        with:
          name: ci-wheel-${{ matrix.os }}
          path: dist/*.whl

      - name: Run Python tests (small/synthetic data only)
        run: |
          pytest python/tests/test_apply_labels.py python/tests/test_apply_missing.py python/tests/test_validate.py python/tests/test_metadata_api.py python/tests/test_writer_issues.py python/tests/test_polars_compat.py python/tests/test_malformed.py python/tests/test_warnings.py python/tests/test_encoding.py python/tests/test_fixtures.py python/tests/test_cli.py -v -k "not RealFile"

  wheel-isa:
    name: Wheel CPU instructions
    needs: python-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-wheel-*
          merge-multiple: true
          path: dist

      - name: Install disassemblers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils llvm

      - name: Check wheels against the portable baseline
        run: python3 scripts/check_wheel_isa.py --x86-baseline x86-64-v2 dist/
