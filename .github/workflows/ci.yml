name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --lib --tests

  python-smoke:
    name: Python wheel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same CPU baselines as release.yml (GitHub issue #6).
          - os: ubuntu-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            rustflags: "-C target-cpu=apple-m1"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system maturin polars pytest

      - name: Build wheel
        run: maturin build --release -o dist

      - name: Install wheel
        shell: bash
        run: uv pip install --system --no-deps dist/*.whl

      - name: Smoke test
        run: python python/tests/smoke_wheel.py

      - uses: actions/upload-artifact@v4
        with:
          name: ci-wheel-${{ matrix.os }}
          path: dist/*.whl

      - name: Run Python tests (small/synthetic data only)
        run: |
          pytest python/tests/test_apply_labels.py python/tests/test_apply_missing.py python/tests/test_validate.py python/tests/test_metadata_api.py python/tests/test_writer_issues.py python/tests/test_polars_compat.py python/tests/test_malformed.py python/tests/test_warnings.py python/tests/test_encoding.py python/tests/test_fixtures.py python/tests/test_cli.py -v -k "not RealFile"

  # Standalone `ambers` binary: no Python, no C runtime to install.
  # Keep in sync with the `cli` job in release.yml.
  cli:
    name: CLI binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+crt-static"
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: "-C target-cpu=apple-m1"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        run: cargo build --release -p ambers-cli --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/ambers info tests/data/survey.zsav --head 3

      - name: Check the binary is standalone (Linux)
        if: runner.os == 'Linux'
        run: |
          if readelf -d target/${{ matrix.target }}/release/ambers | grep NEEDED; then
            echo "::error::the Linux binary needs shared libraries"; exit 1
          fi

      - name: Check the binary is standalone (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_cli_imports.py target/${{ matrix.target }}/release/ambers.exe

      - name: Check the binary is standalone (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L target/${{ matrix.target }}/release/ambers
          if otool -L target/${{ matrix.target }}/release/ambers | grep -i python; then
            echo "::error::the macOS binary links Python"; exit 1
          fi

      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=ambers-$version-${{ matrix.target }}
          mkdir -p cli-dist/$name
          cp README.md LICENSE cli-dist/$name/
          cd cli-dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp ../target/${{ matrix.target }}/release/ambers.exe $name/
            7z a -bso0 $name.zip $name
          else
            cp ../target/${{ matrix.target }}/release/ambers $name/
            tar czf $name.tar.gz $name
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ci-cli-${{ matrix.target }}
          path: |
            cli-dist/*.zip
            cli-dist/*.tar.gz

  wheel-isa:
    name: Wheel and CLI CPU instructions
    needs: [python-smoke, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-cli-*
          merge-multiple: true
          path: dist-cli

      - name: Install disassemblers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils llvm

      - name: Check wheels against the portable baseline
        run: python3 scripts/check_wheel_isa.py --x86-baseline x86-64-v2 dist/

      - name: Check CLI binaries against the portable baseline
        run: |
          # The script reads the architecture from the file name, so copy each
          # binary out of its archive under the archive's (target-tagged) name.
          mkdir cli-bin
          for a in dist-cli/*.tar.gz; do tar xzf "$a" -C dist-cli; done
          for a in dist-cli/*.zip; do unzip -q "$a" -d dist-cli; done
          for d in dist-cli/ambers-*/; do
            for b in "$d"ambers "$d"ambers.exe; do
              if [ -f "$b" ]; then cp "$b" "cli-bin/$(basename "$d")-$(basename "$b")"; fi
            done
          done
          python3 scripts/check_wheel_isa.py --x86-baseline x86-64-v2 cli-bin/*
