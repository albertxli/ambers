[workspace]
resolver = "2"
members = ["crates/*"]
# The Python extension is left out so plain `cargo build` / `cargo test`
# never need a Python interpreter. Build it with maturin.
default-members = [
    "crates/ambers",
    "crates/ambers-codebook",
    "crates/ambers-dataset",
    "crates/ambers-web",
    "crates/ambers-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/albertxli/ambers"

# Every dependency is declared once here; member crates opt in with
# `{ workspace = true }` and add the features they need.
[workspace.dependencies]
# Internal crates. Keep these versions equal to [workspace.package] version.
ambers = { path = "crates/ambers", version = "0.6.0", default-features = false }
ambers-codebook = { path = "crates/ambers-codebook", version = "0.6.0", default-features = false }
ambers-dataset = { path = "crates/ambers-dataset", version = "0.6.0", default-features = false }
ambers-web = { path = "crates/ambers-web", version = "0.6.0", default-features = false }
ambers-cli = { path = "crates/ambers-cli", version = "0.6.0", default-features = false }

# Third party.
anstream = "0.6"
anstyle = "1"
anyhow = "1"
arrow = { version = "57", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "7", default-features = false }
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
indexmap = "2"
insta = "1"
mimalloc = "0.1"
pyo3 = "0.26"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
ts-rs = "12"
unicode-width = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
