[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/albertxli/ambers"

# Every third-party dependency is declared once here; member crates opt in
# with `{ workspace = true }` and add the features they need.
[workspace.dependencies]
arrow = { version = "57", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
encoding_rs = "0.8"
thiserror = "2"
rayon = "1"
indexmap = "2"
mimalloc = "0.1"
pyo3 = "0.26"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
