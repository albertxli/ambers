[package]
name = "ambers-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for ambers: inspect SPSS .sav and .zsav files"
# Not published yet; the binary ships through GitHub Releases and the wheel.
publish = false

[lib]
name = "ambers_cli"

[[bin]]
name = "ambers"
path = "src/main.rs"

# Short alias: `am info file.sav`.
[[bin]]
name = "am"
path = "src/bin/am.rs"

[features]
default = ["web"]
# The browser viewer (`am open`): a local server and the embedded page.
web = ["dep:ambers-web"]

[dependencies]
ambers = { workspace = true }
ambers-codebook = { workspace = true }
ambers-dataset = { workspace = true }
ambers-web = { workspace = true, optional = true }
anstream = { workspace = true }
anstyle = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
clap = { workspace = true }
comfy-table = { workspace = true }
mimalloc = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
ambers-web = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
