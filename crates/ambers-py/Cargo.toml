[package]
name = "ambers-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for ambers (the ambers._ambers extension module)"
publish = false

[lib]
name = "_ambers"
crate-type = ["cdylib"]

[dependencies]
ambers = { workspace = true }
ambers-cli = { workspace = true, features = ["web"] }
arrow = { workspace = true, features = ["ffi"] }
indexmap = { workspace = true }
mimalloc = { workspace = true }
# abi3-py312: built against Python's stable interface, so one wheel per
# platform serves Python 3.12 and every later version (decision 0011).
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312", "indexmap"] }
